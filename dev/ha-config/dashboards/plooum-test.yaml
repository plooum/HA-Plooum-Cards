# Test dashboard — http://127.0.0.1:8123/plooum-test/<view path>
# One view per card (path = slug of the src/cards/<name> folder), plus "all".
# Re-read on every page reload (yaml mode): no HA restart needed.
# dev/bootstrap.py also seeds the UI-editable /plooum-edit dashboard from this file.

title: Plooum Test
views:
  - title: All
    path: all
    cards:
      - type: custom:ha-plooum-multi-status-card
        title: Aquarium
        tap_action_type: none
        temp_entity: sensor.living_room_temperature
        status_items:
          - entity: input_boolean.aquarium_pump
            type: icon
            icon_on: mdi:pump
            icon_off: mdi:pump-off
          - entity: input_boolean.aquarium_co2
            type: icon
            icon_on: mdi:molecule-co2
            icon_off: mdi:molecule-co2
          - entity: switch.tv_plug
            type: icon
            icon_on: mdi:television
            icon_off: mdi:television-off
      - type: custom:ha-plooum-vivarium-card
        name: Aquarium 60L
        items:
          - { role: temperature, entity: sensor.aquarium_60l_temperature }
          - { role: air, entity: input_boolean.aquarium_60_air, critical: true }
          - { role: light, entity: light.aquarium_light }
      - type: custom:ha-plooum-temp-humidity-card
        title: Living Room
        temp_entity: sensor.living_room_temperature
        humidity_entity: sensor.living_room_humidity
      - type: custom:ha-plooum-buttonbadge-card
        entity: light.living_room_light
        name: Living Room
        icon: mdi:ceiling-light
        tap_action_type: toggle
        badge_entity: switch.tv_plug
        badge_icon: mdi:television
        badge_tap_action_type: toggle
      - type: custom:ha-plooum-gridicons-card
        icons:
          - entity: light.living_room_light
            icon: mdi:ceiling-light
            tap_action: { action: toggle }
          - entity: input_boolean.mower
            icon: mdi:robot-mower
            tap_action: { action: toggle }
          - entity: switch.tv_plug
            icon: mdi:television
            tap_action: { action: toggle }
      - type: custom:ha-plooum-cover-card
        lock_enabled: false
        covers:
          - entity: cover.living_room_cover
            name: Living Room
          - entity: cover.bedroom_cover
            name: Bedroom
      - type: custom:ha-plooum-dpad-card
        up_action_type: press
        up_entity: button.ptz_up
        down_action_type: press
        down_entity: button.ptz_down
        left_action_type: press
        left_entity: button.ptz_left
        right_action_type: press
        right_entity: button.ptz_right
        center_action_type: execute_script
        center_script: script.test_script
      - type: custom:ha-plooum-tabs-card
        tabs:
          - name: LIVING ROOM
            cards:
              - type: entities
                entities: [light.living_room_light, switch.tv_plug]
          - name: AQUARIUM
            cards:
              - type: entities
                entities: [input_boolean.aquarium_pump, input_boolean.aquarium_co2]
      # No floors: generated from the areas seeded by dev/bootstrap.py.
      - type: custom:ha-plooum-floorplan-card
        title: Home (generated)
      # Controls to vary states during manual tests.
      - type: entities
        title: Test controls
        entities:
          - input_number.living_room_temperature
          - input_number.living_room_humidity
          - input_boolean.tv_plug_available
          - input_boolean.aquarium_uv
          - counter.ptz_presses
          - counter.script_runs

  - title: Multi Status
    path: multistatus
    cards:
      - type: custom:ha-plooum-multi-status-card
        title: Aquarium
        tap_action_type: toggle
        tap_action_entity: input_boolean.aquarium_pump
        temp_entity: sensor.living_room_temperature
        status_items:
          - entity: input_boolean.aquarium_pump
            type: icon
            icon_on: mdi:pump
            icon_off: mdi:pump-off
          - entity: input_boolean.aquarium_co2
            type: icon
            icon_on: mdi:molecule-co2
            icon_off: mdi:molecule-co2
            color_on: "#29b6f6"
          - entity: input_boolean.aquarium_uv
            type: svg
            color_on: "#ab47bc"
            svg_content: |
              (color) => `
                <svg viewBox="0 0 24 24" style="width: 22px; height: 22px; fill: ${color};">
                  <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4Z" opacity="0.3" />
                  <text x="12" y="15.5" font-size="10" font-weight="900" font-family="Roboto, sans-serif" text-anchor="middle" fill="${color}">UV</text>
                </svg>
              `
          - entity: switch.tv_plug
            type: icon
            icon_on: mdi:television
            icon_off: mdi:television-off
          # Missing entity: must stay readable without breaking the card.
          - entity: switch.does_not_exist
            type: icon
            icon_on: mdi:help-circle
            icon_off: mdi:help-circle-outline
      - type: custom:ha-plooum-multi-status-card
        title: No main value
        tap_action_type: none
        show_temp: false
        status_items:
          - entity: light.living_room_light
            type: icon
            icon_on: mdi:lightbulb
            icon_off: mdi:lightbulb-off
            color_on: "#fdd835"
      # Condensed: title and value on one line; in narrow cells the title becomes a badge.
      - type: custom:ha-plooum-multi-status-card
        title: Aquarium condensed
        condensed: true
        tap_action_type: none
        temp_entity: sensor.aquarium_temperature
        status_items: &condensed_items
          - entity: light.aquarium_light
            type: icon
            icon_on: mdi:lightbulb
            icon_off: mdi:lightbulb-off
            color_on: "#fdd835"
          - entity: input_boolean.aquarium_co2
            type: icon
            icon_on: mdi:molecule-co2
            icon_off: mdi:molecule-co2
            color_on: "#29b6f6"
          - entity: switch.tv_plug
            type: icon
            icon_on: mdi:television
            icon_off: mdi:television-off
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:ha-plooum-multi-status-card
            title: 150L
            condensed: true
            tap_action_type: none
            temp_entity: sensor.aquarium_temperature
            status_items: *condensed_items
          - type: custom:ha-plooum-multi-status-card
            title: Terrarium
            condensed: true
            tap_action_type: none
            temp_entity: sensor.terrarium_temperature
            status_items: *condensed_items
          - type: custom:ha-plooum-multi-status-card
            title: A very long pond title
            condensed: true
            badge_position: right
            tap_action_type: none
            temp_entity: sensor.pond_temperature
            status_items: *condensed_items
      - type: entities
        title: Test controls
        entities:
          - input_boolean.aquarium_pump
          - input_boolean.aquarium_co2
          - input_boolean.aquarium_uv
          - input_boolean.tv_plug
          - input_boolean.tv_plug_available
          - input_number.living_room_temperature

  - title: Temp & Humidity
    path: temp-humidity
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Default
          - type: custom:ha-plooum-temp-humidity-card
            title: Living Room
            temp_entity: sensor.living_room_temperature
            humidity_entity: sensor.living_room_humidity
          - type: heading
            heading: Condensed (one grid row)
          - type: custom:ha-plooum-temp-humidity-card
            title: Living Room
            condensed: true
            temp_entity: sensor.living_room_temperature
            humidity_entity: sensor.living_room_humidity
          - type: custom:ha-plooum-temp-humidity-card
            title: Kitchen
            condensed: true
            main_icon: mdi:stove
            temp_entity: sensor.kitchen_temperature
            humidity_entity: sensor.living_room_humidity
          # Narrow cells: the title becomes a badge (left by default, right on the second one).
          - type: custom:ha-plooum-temp-humidity-card
            title: Living Room
            condensed: true
            temp_entity: sensor.living_room_temperature
            humidity_entity: sensor.living_room_humidity
            grid_options: { columns: 4 }
          - type: custom:ha-plooum-temp-humidity-card
            title: Bedroom
            condensed: true
            badge_position: right
            main_icon: mdi:bed
            temp_entity: sensor.bedroom_temperature
            humidity_entity: sensor.living_room_humidity
            grid_options: { columns: 4 }
          - type: custom:ha-plooum-temp-humidity-card
            title: No icon
            condensed: true
            main_icon: ""
            temp_entity: sensor.bedroom_temperature
            humidity_entity: sensor.living_room_humidity
            grid_options: { columns: 4 }
          # Missing entity: shows "N/A" without breaking the line.
          - type: custom:ha-plooum-temp-humidity-card
            title: Missing
            condensed: true
            temp_entity: sensor.does_not_exist
            humidity_entity: sensor.living_room_humidity
            grid_options: { columns: 6 }
          - type: custom:ha-plooum-temp-humidity-card
            # Without title: icon and values only.
            condensed: true
            title: ""
            temp_entity: sensor.kitchen_temperature
            humidity_entity: sensor.living_room_humidity
            grid_options: { columns: 6 }
          # Quarter cells with big values (phone): the icon gives way, then the values shrink.
          - type: custom:ha-plooum-temp-humidity-card
            title: Exterior
            condensed: true
            main_icon: "mdi:tree"
            temp_font_size: 18px
            humidity_font_size: 18px
            temp_entity: sensor.living_room_temperature
            humidity_entity: sensor.living_room_humidity
            grid_options: { columns: 3 }
          - type: custom:ha-plooum-temp-humidity-card
            title: Bedroom
            condensed: true
            main_icon: "mdi:bed"
            temp_font_size: 18px
            humidity_font_size: 18px
            temp_entity: sensor.living_room_temperature
            humidity_entity: sensor.living_room_humidity
            grid_options: { columns: 3 }
          - type: custom:ha-plooum-temp-humidity-card
            title: Ch. A
            condensed: true
            main_icon: "mdi:account-group"
            temp_font_size: 18px
            humidity_font_size: 18px
            temp_entity: sensor.living_room_temperature
            humidity_entity: sensor.living_room_humidity
            grid_options: { columns: 3 }
          - type: custom:ha-plooum-temp-humidity-card
            title: Office
            condensed: true
            main_icon: "mdi:laptop"
            temp_font_size: 18px
            humidity_font_size: 18px
            temp_entity: sensor.living_room_temperature
            humidity_entity: sensor.living_room_humidity
            grid_options: { columns: 3 }

  - title: Floorplan
    path: floorplan
    # Panel view: the plan gets the full width.
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:ha-plooum-floorplan-card
            title: Home
            # Anchor: the 3D card below shows the same plan.
            floors: &home_floors
              - name: Ground floor
                rooms:
                  - { name: Living Room, icon: "mdi:sofa", x: 0, y: 0, w: 7, h: 5 }
                  - { name: Kitchen, icon: "mdi:stove", x: 7, y: 0, w: 4, h: 3 }
                  - { name: Hallway, icon: "mdi:door", x: 7, y: 3, w: 4, h: 2 }
                  # Outdoor: no walls, no roof.
                  - { name: Terrace, icon: "mdi:flower", x: 0, y: 5, w: 7, h: 2.5, outdoor: true }
                entities:
                  - { entity: light.living_room_light, x: 3, y: 2.5 }
                  - { entity: switch.tv_plug, x: 5.5, y: 4 }
                  - { entity: sensor.living_room_temperature, x: 6, y: 1 }
                  - { entity: sensor.living_room_humidity, x: 6.5, y: 1 }
                  # Top wall: horizontal window, a bay window down to the floor.
                  - { entity: cover.living_room_cover, x: 3.5, y: 0, length: 2.5, floor_length: true }
                  - { entity: light.kitchen_light, x: 9, y: 1.5 }
                  - { entity: sensor.kitchen_temperature, x: 10.5, y: 0.5 }
                  - { entity: binary_sensor.front_door, x: 10.25, y: 4.25 }
                  - { entity: binary_sensor.hallway_motion, x: 8, y: 4 }
                  # Not a light, but lights up the Hallway like one (light: true).
                  - { entity: input_boolean.aquarium_uv, x: 9.5, y: 3.75, light: true }
                  # Missing entity: must stay readable without breaking the card.
                  - { entity: switch.does_not_exist, x: 1, y: 4 }
                  # Outside any room: shown as a badge.
                  - { entity: counter.ptz_presses, x: 12, y: 2 }
                  # Cameras outdoors (on an outer wall looking out, in the garden) and indoors.
                  # In the garden, looking at the house; films it for real (HOUSE_VIEW in
                  # plooum_dev/camera.py: keep in sync): projected, its picture must fall exactly
                  # on the ground, the outer walls and the roof slopes facing it. Its wide-angle lens
                  # bends straight lines (distortion).
                  - { entity: camera.garden_camera, x: 14, y: 10, direction: 310, tilt: 12, distortion: -0.25, projection: true }
                  - { entity: camera.driveway_camera, x: 11, y: 1.5, direction: 90, fov: 70 }
                  # Films the Living Room for real (ROOM_VIEW in plooum_dev/camera.py: keep in sync):
                  # projected, its picture must fall exactly on the floor and walls.
                  - { entity: camera.living_room_camera, x: 0.25, y: 0.25, direction: 135, fov: 100, projection: true }
                  # No direction: looks at the middle of its room.
                  - { entity: camera.kitchen_camera, x: 10.75, y: 2.75 }
                  # Missing camera entity.
                  - { entity: camera.does_not_exist, x: 13, y: 5, direction: 225 }
              - name: Upstairs
                rooms:
                  # A room sensor that isn't placed on the plan (room `humidity`).
                  - { name: Bedroom, icon: "mdi:bed", x: 0, y: 0, w: 5, h: 4, humidity: sensor.living_room_humidity }
                  - { name: Bathroom, x: 5, y: 0, w: 3, h: 4 }
                entities:
                  - { entity: light.bedroom_light, x: 2.5, y: 2 }
                  - { entity: sensor.bedroom_temperature, x: 4.5, y: 0.5 }
                  # Left wall: vertical window.
                  - { entity: cover.bedroom_cover, x: 0, y: 2 }
                  # Unavailable when input_boolean.garage_camera_available is off. Its thumbnail
                  # (camera_previews: always) is forced to its left.
                  - { entity: camera.garage_camera, x: 4.75, y: 3.75, direction: 315, preview_position: left }
          - type: custom:ha-plooum-floorplan-card
            title: Home, camera thumbnails
            # Thumbnails always shown next to the cameras. camera_view: live must not reach the
            # 2D plan (previews, room panel): snapshots only, the live stream opens on a tap.
            camera_previews: always
            camera_view: live
            floors: *home_floors
          - type: custom:ha-plooum-floorplan-card
            title: Home in 3D
            view: 3d
            floors: *home_floors
          - type: custom:ha-plooum-floorplan-card
            title: Home in 3D, floating screens
            view: 3d
            roof: false
            screen_mode: billboard
            floors: *home_floors
          - type: custom:ha-plooum-floorplan-card
            title: Rooms in several zones
            # Rooms with the same name make one room: an L-shaped Living Room (2 zones: light in
            # one, sensors in the other, no wall between them), and a Garden around the home (4
            # outdoor zones). Shown once, one panel, the motion outline goes around the whole room.
            floors:
              - name: Ground floor
                rooms:
                  - { name: Living Room, icon: "mdi:sofa", x: 0, y: 0, w: 6, h: 3 }
                  - { name: Living Room, x: 0, y: 3, w: 3, h: 3 }
                  - { name: Kitchen, icon: "mdi:stove", x: 3, y: 3, w: 3, h: 3 }
                  - { name: Garden, icon: "mdi:flower", x: -2, y: -2, w: 10, h: 2, outdoor: true }
                  - { name: Garden, x: 6, y: 0, w: 2, h: 8, outdoor: true }
                  - { name: Garden, x: -2, y: 6, w: 8, h: 2, outdoor: true }
                  - { name: Garden, x: -2, y: 0, w: 2, h: 6, outdoor: true }
                entities:
                  - { entity: light.living_room_light, x: 4.5, y: 1.5 }
                  - { entity: sensor.living_room_temperature, x: 1, y: 5 }
                  - { entity: sensor.living_room_humidity, x: 2, y: 5 }
                  - { entity: binary_sensor.hallway_motion, x: 1.5, y: 4 }
                  - { entity: light.kitchen_light, x: 4.5, y: 4.5 }
                  - { entity: input_boolean.mower, x: 7, y: 6 }
                  # Looks along the L: its cone and projection cover both zones.
                  - { entity: camera.kitchen_camera, x: 0.25, y: 5.75, direction: 20, projection: true }
          - type: horizontal-stack
            cards:
              - type: custom:ha-plooum-floorplan-card
                title: Generated from areas
              - type: entities
                title: Test controls
                entities:
                  - input_boolean.living_room_light
                  - input_boolean.kitchen_light
                  - input_boolean.bedroom_light
                  - input_boolean.aquarium_uv
                  - input_boolean.tv_plug_available
                  - input_boolean.garage_camera_available
                  - input_number.living_room_cover_position
                  - input_boolean.front_door_open
                  - input_boolean.hallway_motion
                  - input_number.living_room_temperature
                  - input_number.kitchen_temperature
                  - input_number.bedroom_temperature
                  - input_number.living_room_cover_position
                  - input_number.bedroom_cover_position

  - title: Vivarium
    path: vivarium
    # Sections view: grid_options make narrow and short cards (auto-fold cases).
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: The user's vivariums
          # Every role type: measures (close to limit), non-numeric pH, custom measure,
          # critical actuator, dimmable light, feeder script.
          - type: custom:ha-plooum-vivarium-card
            name: Aquarium 150L
            grid_options: { columns: 12 }
            items:
              - { role: temperature, entity: sensor.aquarium_temperature }
              - { role: ph, entity: sensor.aquarium_ph }
              - role: custom
                kind: measure
                name: Nitrate
                icon: mdi:flask
                entity: input_number.aquarium_nitrate
                max: 25
              - { role: co2, entity: input_boolean.aquarium_co2 }
              - { role: air, entity: input_boolean.aquarium_pump, critical: true }
              - { role: light, entity: light.aquarium_light }
              - { role: uv, entity: input_boolean.aquarium_uv }
              - { role: feeder, entity: script.test_script }
          # Too warm + critical air off: "Too warm · since … · +1".
          - type: custom:ha-plooum-vivarium-card
            name: Aquarium 60L
            items:
              - { role: temperature, entity: sensor.aquarium_60l_temperature }
              - { role: air, entity: input_boolean.aquarium_60_air, critical: true }
              - { role: light, entity: light.living_room_light }
          # Light only, no measure: "Night" when off.
          - type: custom:ha-plooum-vivarium-card
            name: Aquarium 10L
            items:
              - { role: light, entity: light.bedroom_light }
          - type: custom:ha-plooum-vivarium-card
            name: Pond
            vivarium_type: pond
            items:
              - { role: temperature, entity: sensor.pond_temperature }
              - { role: uv, entity: switch.pond_uv }
          # Secondary measure, four actuators; the UVB becomes unavailable.
          - type: custom:ha-plooum-vivarium-card
            name: Terrarium
            vivarium_type: terrarium
            items:
              - { role: temperature, entity: sensor.terrarium_temperature }
              - { role: humidity, entity: sensor.terrarium_humidity }
              - { role: heater, entity: switch.terrarium_heat_lamp, name: Heat lamp }
              - { role: mister, entity: switch.terrarium_mister }
              - { role: uv, entity: switch.terrarium_uvb, name: UVB }
              - { role: light, entity: light.kitchen_light }
      - type: grid
        cards:
          - type: heading
            heading: Edge cases
          # 21.4 °C against the aquarium range: too cold.
          - type: custom:ha-plooum-vivarium-card
            name: Too cold
            items:
              - { role: temperature, entity: sensor.living_room_temperature }
              - { role: heater, entity: light.living_room_light }
          # Missing entities, a critical unavailable one (switch.tv_plug), a measure without range.
          - type: custom:ha-plooum-vivarium-card
            name: Missing and unavailable
            items:
              - { role: water_level, entity: sensor.living_room_humidity, main: true }
              - { role: temperature, entity: sensor.does_not_exist }
              - { role: filter, entity: switch.does_not_exist }
              - { role: pump, entity: switch.tv_plug, critical: true }
          # Actuators only, none of them a light: "Off" when everything is off.
          - type: custom:ha-plooum-vivarium-card
            name: Actuators only
            vivarium_type: paludarium
            items:
              - { role: pump, entity: input_boolean.mower }
              - role: custom
                kind: actuator
                name: Fogger
                icon: mdi:weather-fog
                color: "#8e24aa"
                entity: input_boolean.aquarium_co2
          - type: custom:ha-plooum-vivarium-card
            name: Empty
      - type: grid
        cards:
          - type: heading
            heading: Strip styles
          - type: custom:ha-plooum-vivarium-card
            name: Aquarium 60L
            strip_style: tinted
            items: &aquarium_60
              - { role: temperature, entity: sensor.aquarium_60l_temperature }
              - { role: air, entity: input_boolean.aquarium_60_air, critical: true }
              - { role: light, entity: light.living_room_light }
          - type: custom:ha-plooum-vivarium-card
            name: Aquarium 60L
            strip_style: solid
            items: *aquarium_60
          - type: custom:ha-plooum-vivarium-card
            name: Pond
            vivarium_type: pond
            strip_style: tinted
            items: &pond
              - { role: temperature, entity: sensor.pond_temperature }
              - { role: uv, entity: switch.pond_uv }
          - type: custom:ha-plooum-vivarium-card
            name: Pond
            vivarium_type: pond
            strip_style: solid
            items: *pond
          - type: custom:ha-plooum-vivarium-card
            name: Aquarium 10L
            strip_style: solid
            items:
              - { role: light, entity: light.bedroom_light }
      - type: grid
        cards:
          - type: heading
            heading: Folding
          - type: custom:ha-plooum-vivarium-card
            name: Folded by config
            fold: folded
            items: *aquarium_60
          # Narrow: auto-folds (below 240 px).
          # Narrow: auto-folds (below 240 px).
          - type: custom:ha-plooum-vivarium-card
            name: Narrow
            vivarium_type: pond
            grid_options: { columns: 3 }
            items: *pond
          - type: custom:ha-plooum-vivarium-card
            name: Forced open
            vivarium_type: pond
            fold: unfolded
            grid_options: { columns: 3 }
            items: *pond
          # Full width but one row high: auto-folds.
          - type: custom:ha-plooum-vivarium-card
            name: Short
            grid_options: { columns: 12, rows: 1 }
            items: *aquarium_60
          - type: entities
            title: Test controls
            entities:
              - input_number.aquarium_temperature
              - input_number.aquarium_60_temperature
              - input_boolean.aquarium_60_air
              - input_boolean.aquarium_pump
              - input_number.aquarium_light_level
              - input_boolean.aquarium_ph_calibrating
              - input_number.terrarium_humidity
              - input_boolean.terrarium_uvb_available
              - input_boolean.pond_uv
              - input_boolean.bedroom_light
              - input_boolean.tv_plug_available
              - counter.script_runs
