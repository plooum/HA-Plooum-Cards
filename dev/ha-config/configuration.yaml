# Development Home Assistant for HA-Plooum-Cards.
# Started by dev/ha.sh — see CLAUDE.md, "Testing" section.
#
# Every test entity can be driven: through its own services (toggle,
# set_cover_position...) or through the input_* helpers backing it.

homeassistant:
  name: Plooum Dev
  unit_system: metric
  time_zone: Europe/Paris
  country: FR
  language: en
  currency: EUR
  latitude: 48.8566
  longitude: 2.3522
  elevation: 35
  auth_providers:
    # First, so the local browser (Claude Code pane, Chrome) logs in
    # automatically, without a login screen.
    - type: trusted_networks
      trusted_networks:
        - 127.0.0.1/32
        - ::1/128
      allow_bypass_login: true
    # Needed for the scripted onboarding and tokens (dev/bootstrap.py).
    - type: homeassistant

# No `http:` block here: since HA 2026.x it is migrated into a "pending" config that
# must be confirmed in the UI. dev/ha.sh seeds .storage/http (listens on 127.0.0.1:8123).

frontend:
# Lets the floorplan editor capture a camera's reference picture (/api/image/upload).
image_upload:
config:
# The frontend calls recorder/info: without recorder, every page load logs an
# "unknown_command" rejection (console noise). history is used by more-info dialogs.
recorder:
  purge_keep_days: 1
history:
logger:
  default: warning
  logs:
    custom_components.plooum_dev: info

# Serves ../../ha-plooum-cards.js (and its sourcemap) without caching under /plooum_dev/:
# `npm run build` + a page reload is enough to test.
plooum_dev:

lovelace:
  resource_mode: yaml
  # Loaded as a Lovelace resource, exactly like a HACS install in production.
  # (frontend: extra_module_url loads too early, before the frontend's custom
  # element registry polyfill: the cards would never be found.)
  resources:
    - url: /plooum_dev/ha-plooum-cards.js
      type: module
  dashboards:
    plooum-test:
      mode: yaml
      title: Plooum Test
      icon: mdi:test-tube
      show_in_sidebar: true
      filename: dashboards/plooum-test.yaml

# ---------------------------------------------------------------------------
# Test entities
# ---------------------------------------------------------------------------

input_boolean:
  living_room_light:
    name: Living room light (backing)
  tv_plug:
    name: TV plug (backing)
  tv_plug_available:
    name: TV plug available
    initial: true
  aquarium_pump:
    name: Aquarium pump
    icon: mdi:pump
  aquarium_co2:
    name: Aquarium CO2
    icon: mdi:molecule-co2
  aquarium_uv:
    name: Aquarium UV
  mower:
    name: Mower
    icon: mdi:robot-mower
  # Floorplan card: extra rooms (areas are assigned by dev/bootstrap.py).
  bedroom_light:
    name: Bedroom light (backing)
  kitchen_light:
    name: Kitchen light (backing)
  front_door_open:
    name: Front door open (backing)
  hallway_motion:
    name: Hallway motion (backing)
  # camera.garage_camera (fake camera from plooum_dev) is unavailable when off.
  garage_camera_available:
    name: Garage camera available
    initial: true
  # Vivarium card: aquariums, terrarium and pond (aquarium_pump/co2/uv above are reused).
  aquarium_60_air:
    name: Aquarium 60L air (critical)
    icon: mdi:chart-bubble
    initial: false
  aquarium_ph_calibrating:
    name: Aquarium pH calibrating
    initial: false
  terrarium_heat_lamp:
    name: Terrarium heat lamp (backing)
    initial: true
  terrarium_mister:
    name: Terrarium mister (backing)
    initial: false
  terrarium_uvb:
    name: Terrarium UVB (backing)
    initial: true
  # switch.terrarium_uvb is unavailable when off.
  terrarium_uvb_available:
    name: Terrarium UVB available
    initial: true
  pond_uv:
    name: Pond UV (backing)
    initial: true

input_number:
  living_room_temperature:
    name: Living room temperature (backing)
    min: -10
    max: 40
    step: 0.1
    initial: 21.4
  living_room_humidity:
    name: Living room humidity (backing)
    min: 0
    max: 100
    step: 1
    initial: 48
  living_room_cover_position:
    name: Living room cover position (backing)
    min: 0
    max: 100
    step: 1
    initial: 100
  bedroom_cover_position:
    name: Bedroom cover position (backing)
    min: 0
    max: 100
    step: 1
    initial: 30
  bedroom_temperature:
    name: Bedroom temperature (backing)
    min: -10
    max: 40
    step: 0.1
    initial: 18.2
  kitchen_temperature:
    name: Kitchen temperature (backing)
    min: -10
    max: 40
    step: 0.1
    initial: 25.6
  # Vivarium card.
  aquarium_temperature:
    name: Aquarium 150L temperature (backing)
    min: 10
    max: 40
    step: 0.1
    initial: 25.9
  aquarium_60_temperature:
    name: Aquarium 60L temperature (backing)
    min: 10
    max: 40
    step: 0.1
    initial: 27.9
  aquarium_light_level:
    name: Aquarium light level (backing)
    min: 0
    max: 100
    step: 1
    initial: 80
  aquarium_ph:
    name: Aquarium pH (backing)
    min: 4
    max: 10
    step: 0.1
    initial: 6.9
  aquarium_nitrate:
    name: Aquarium nitrate
    min: 0
    max: 100
    step: 1
    initial: 10
    unit_of_measurement: mg/L
  terrarium_temperature:
    name: Terrarium temperature (backing)
    min: 10
    max: 45
    step: 0.1
    initial: 27.2
  terrarium_humidity:
    name: Terrarium humidity (backing)
    min: 0
    max: 100
    step: 1
    initial: 72
  pond_temperature:
    name: Pond temperature (backing)
    min: -5
    max: 35
    step: 0.1
    initial: 17.8

counter:
  ptz_presses:
    name: PTZ presses
  script_runs:
    name: Script runs

script:
  test_script:
    alias: Test script
    sequence:
      - action: counter.increment
        target:
          entity_id: counter.script_runs

template:
  - sensor:
      - name: Living Room Temperature
        unique_id: plooum_dev_living_room_temperature
        state: "{{ states('input_number.living_room_temperature') }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      - name: Living Room Humidity
        unique_id: plooum_dev_living_room_humidity
        state: "{{ states('input_number.living_room_humidity') }}"
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
      - name: Bedroom Temperature
        unique_id: plooum_dev_bedroom_temperature
        state: "{{ states('input_number.bedroom_temperature') }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      - name: Kitchen Temperature
        unique_id: plooum_dev_kitchen_temperature
        state: "{{ states('input_number.kitchen_temperature') }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      # Vivarium card.
      - name: Aquarium Temperature
        unique_id: plooum_dev_aquarium_temperature
        state: "{{ states('input_number.aquarium_temperature') }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      - name: Aquarium 60L Temperature
        unique_id: plooum_dev_aquarium_60_temperature
        state: "{{ states('input_number.aquarium_60_temperature') }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      # Non-numeric ("calibrating") while input_boolean.aquarium_ph_calibrating is on.
      - name: Aquarium pH
        unique_id: plooum_dev_aquarium_ph
        state: >-
          {{ 'calibrating' if is_state('input_boolean.aquarium_ph_calibrating', 'on')
             else states('input_number.aquarium_ph') }}
      - name: Terrarium Temperature
        unique_id: plooum_dev_terrarium_temperature
        state: "{{ states('input_number.terrarium_temperature') }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      - name: Terrarium Humidity
        unique_id: plooum_dev_terrarium_humidity
        state: "{{ states('input_number.terrarium_humidity') }}"
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
      - name: Pond Temperature
        unique_id: plooum_dev_pond_temperature
        state: "{{ states('input_number.pond_temperature') }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

    binary_sensor:
      - name: Front Door
        unique_id: plooum_dev_front_door
        device_class: door
        state: "{{ is_state('input_boolean.front_door_open', 'on') }}"
      - name: Hallway Motion
        unique_id: plooum_dev_hallway_motion
        device_class: motion
        state: "{{ is_state('input_boolean.hallway_motion', 'on') }}"

    light:
      - name: Living Room Light
        unique_id: plooum_dev_living_room_light
        state: "{{ is_state('input_boolean.living_room_light', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.living_room_light
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.living_room_light
      - name: Bedroom Light
        unique_id: plooum_dev_bedroom_light
        state: "{{ is_state('input_boolean.bedroom_light', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.bedroom_light
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.bedroom_light
      - name: Kitchen Light
        unique_id: plooum_dev_kitchen_light
        state: "{{ is_state('input_boolean.kitchen_light', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.kitchen_light
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.kitchen_light
      # Dimmable: its level is input_number.aquarium_light_level (%), 0 = off.
      - name: Aquarium Light
        unique_id: plooum_dev_aquarium_light
        state: "{{ states('input_number.aquarium_light_level') | float(0) > 0 }}"
        level: "{{ (states('input_number.aquarium_light_level') | float(0) * 2.55) | round(0) }}"
        turn_on:
          - action: input_number.set_value
            target:
              entity_id: input_number.aquarium_light_level
            data:
              value: >-
                {{ 80 if states('input_number.aquarium_light_level') | float(0) == 0
                   else states('input_number.aquarium_light_level') }}
        turn_off:
          - action: input_number.set_value
            target:
              entity_id: input_number.aquarium_light_level
            data:
              value: 0
        set_level:
          - action: input_number.set_value
            target:
              entity_id: input_number.aquarium_light_level
            data:
              value: "{{ (brightness / 2.55) | round(0) }}"

    switch:
      # Becomes "unavailable" when input_boolean.tv_plug_available is off.
      - name: TV Plug
        unique_id: plooum_dev_tv_plug
        state: "{{ is_state('input_boolean.tv_plug', 'on') }}"
        availability: "{{ is_state('input_boolean.tv_plug_available', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.tv_plug
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.tv_plug
      # Vivarium card.
      - name: Terrarium Heat Lamp
        unique_id: plooum_dev_terrarium_heat_lamp
        state: "{{ is_state('input_boolean.terrarium_heat_lamp', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.terrarium_heat_lamp
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.terrarium_heat_lamp
      - name: Terrarium Mister
        unique_id: plooum_dev_terrarium_mister
        state: "{{ is_state('input_boolean.terrarium_mister', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.terrarium_mister
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.terrarium_mister
      # Becomes "unavailable" when input_boolean.terrarium_uvb_available is off.
      - name: Terrarium UVB
        unique_id: plooum_dev_terrarium_uvb
        state: "{{ is_state('input_boolean.terrarium_uvb', 'on') }}"
        availability: "{{ is_state('input_boolean.terrarium_uvb_available', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.terrarium_uvb
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.terrarium_uvb
      - name: Pond UV
        unique_id: plooum_dev_pond_uv
        state: "{{ is_state('input_boolean.pond_uv', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.pond_uv
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.pond_uv

    cover:
      - name: Living Room Cover
        unique_id: plooum_dev_living_room_cover
        device_class: shutter
        position: "{{ states('input_number.living_room_cover_position') | int }}"
        open_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.living_room_cover_position
            data:
              value: 100
        close_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.living_room_cover_position
            data:
              value: 0
        stop_cover: []
        set_cover_position:
          - action: input_number.set_value
            target:
              entity_id: input_number.living_room_cover_position
            data:
              value: "{{ position }}"
      - name: Bedroom Cover
        unique_id: plooum_dev_bedroom_cover
        device_class: shutter
        position: "{{ states('input_number.bedroom_cover_position') | int }}"
        open_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.bedroom_cover_position
            data:
              value: 100
        close_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.bedroom_cover_position
            data:
              value: 0
        stop_cover: []
        set_cover_position:
          - action: input_number.set_value
            target:
              entity_id: input_number.bedroom_cover_position
            data:
              value: "{{ position }}"

    button:
      - name: PTZ Up
        unique_id: plooum_dev_ptz_up
        press:
          - action: counter.increment
            target:
              entity_id: counter.ptz_presses
      - name: PTZ Down
        unique_id: plooum_dev_ptz_down
        press:
          - action: counter.increment
            target:
              entity_id: counter.ptz_presses
      - name: PTZ Left
        unique_id: plooum_dev_ptz_left
        press:
          - action: counter.increment
            target:
              entity_id: counter.ptz_presses
      - name: PTZ Right
        unique_id: plooum_dev_ptz_right
        press:
          - action: counter.increment
            target:
              entity_id: counter.ptz_presses
