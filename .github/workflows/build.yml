name: Build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build the bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Every build can be downloaded from its run page.
      - uses: actions/upload-artifact@v4
        with:
          name: ha-plooum-cards
          path: |
            ha-plooum-cards.js
            ha-plooum-cards.js.map

      # On a published release, attach the bundle to it: HACS downloads it from there.
      - name: Attach the bundle to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ha-plooum-cards.js ha-plooum-cards.js.map --clobber --repo "${{ github.repository }}"
